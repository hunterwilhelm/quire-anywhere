name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('app/manifest.json', 'utf8'))"
      - name: Scripts parse as ES modules
        run: |
          status=0
          while IFS= read -r f; do
            node --check --input-type=module < "$f" || { echo "::error file=$f::syntax error"; status=1; }
          done < <(find app -name '*.js' -not -path 'app/libraries/*')
          exit $status
      - name: Client secret is not tracked
        run: '! git ls-files | grep -iE "(^|/)app\.secret\.php$"'
